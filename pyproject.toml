[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = 'ce-ui'
description = 'The user-facing interface of contact.engineering.'
requires-python = ">=3.10.0"
readme = 'README.rst'
license = { file = 'LICENSE' }
authors = [
    { name = "Michael Röttger", email = "info@michael-roettger.de" },
    { name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de" },
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Web Environment',
    'Framework :: Django',
    'Framework :: Celery',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Operating System :: POSIX',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Internet :: WWW/HTTP',
    'Topic :: Internet :: WWW/HTTP :: Dynamic Content',
]
dependencies = [
    'django-termsandconditions>=2.0.8',
    'celery[redis]',
    'boto3',
    'argon2-cffi',
    'servestatic',
    'psycopg[binary]',
    'django-environ',
    'django-crispy-forms',
    'crispy-bootstrap5',
    'django-redis',
    'django-watchman',
    'django-request-profiler',
    'django-filter',
    'djangorestframework',
    'drf-spectacular>=0.27.2',
    'gunicorn[gevent]>=20.1.0',
    'uvicorn[standard]',
]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-django>=4.4.0',
    # https://github.com/pytest-dev/pytest-django
    'pytest-mock',
    'pytest-cov',
    'django-celery-results',
    'factory-boy',
    'django-test-plus',
    'dj-inmemorystorage',
]

[project.urls]
homepage = 'https://contact.engineering'
repository = 'https://github.com/ContactEngineering/ce-ui'

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
# `.gitignore` contains a bare `static/` pattern, meant for the webpack output
# directory at the repository root and for `staticfiles/`. It also matches this
# package's own static directory, and hatchling honours VCS ignore files when
# selecting files for a distribution. Without this override the app's static
# assets (favicon, logos, Creative Commons images, terms & conditions, the
# vendored OpenSeadragon viewer) are absent from the built wheel, so Django's
# `AppDirectoriesFinder` cannot find them and `collectstatic` silently omits
# them. `ManifestStaticFilesStorage` then raises `ValueError: Missing staticfiles
# manifest entry for ...` on the first `{% static %}` lookup.
artifacts = ["ce_ui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["ce_ui"]
# `ce_ui.bokehjs` reads the pinned BokehJS version from here, so that the version
# loaded from the CDN cannot drift from the one the app was compiled against. The
# file lives at the repository root, which is outside the package.
force-include = { "package.json" = "ce_ui/package.json" }

[tool.coverage.run]
# Generated migration modules would dilute the coverage numbers
omit = ["*/migrations/*"]
