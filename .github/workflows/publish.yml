# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # `ce_ui/static/css/theme.css` is built, not committed, and the base
    # template links it. `pyproject.toml` packages `ce_ui/static/**`, so
    # building it here is what puts it in the sdist -- without this the release
    # ships without the site's stylesheet, and a deployment (which resolves
    # static files through a manifest) raises on every page it serves.
    - name: Set up node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - name: Build the theme stylesheet
      run: |
        npm ci
        npm run build-css
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build . -s
    - name: Publish package
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN_PASTEWKA }}
