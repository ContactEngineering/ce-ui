name: Test code functionality

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: topobank-test
        ports:
          - 5432:5432

    env:
      USE_DOCKER: no
      DJANGO_SETTINGS_MODULE: ce_ui.settings.test
      DATABASE_URL: postgres://postgres:secret@localhost/topobank-test

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up python3 ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: |
        pip install --upgrade pip pip-tools
        pip install \
          git+https://github.com/ContactEngineering/topobank.git@main \
          git+https://github.com/ContactEngineering/topobank-rest-api.git@main \
          git+https://github.com/ContactEngineering/topobank-statistics.git@main \
          git+https://github.com/ContactEngineering/topobank-contact.git@main \
          git+https://github.com/ContactEngineering/topobank-publication.git@main
        # Installed editable on purpose: `pytest.ini` sets
        # `--import-mode=importlib` and does not put the repository root on
        # `sys.path`, so a copied (non-editable) install means the tests import
        # `ce_ui` from site-packages while coverage measures the source tree
        # here -- which never executes, and reported every application module as
        # 0%. An editable install leaves exactly one copy of the code.
        pip install -e '.[dev]'

    - name: Test
      run: PYTHONPATH=/tmp/topobank pytest -v --cov=ce_ui --cov-report=term --cov-report=xml

    - name: Publish coverage summary
      if: always()
      run: |
        if [ -f .coverage ]; then
          echo "## Code coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.xml
        if-no-files-found: ignore
