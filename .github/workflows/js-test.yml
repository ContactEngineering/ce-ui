name: Test JavaScript code

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # Node 24 (npm 11) matches the version pinned in the devbox development
        # environment, so `npm ci` here resolves the lock file the same way it
        # does locally.
        node-version: ['24']

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up node ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Run unit tests
      run: |
        set -o pipefail
        npm test -- --coverage | tee vitest-output.txt

    - name: Publish coverage summary
      if: always()
      run: |
        # The v8 text report is the tail of the test output
        if grep -q "Coverage report from v8" vitest-output.txt; then
          echo "## Frontend code coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Coverage report from v8/,$p' vitest-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Check that the webpack bundle builds
      run: |
        npm run build-prod
